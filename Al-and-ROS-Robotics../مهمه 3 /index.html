<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد الذكي</title>
  <style>
    :root {
      --bg: #090314;
      --card: #150a2b;
      --card-light: #211244;
      --text: #f5f3ff;
      --muted: #a78bfa;
      --purple: #8b5cf6;
      --purple-hover: #7c3aed;
      --user-bubble: #8b5cf6;
      --bot-bubble: #211244;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b0f38 0%, var(--bg) 100%);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    .chat-container {
      width: 92%;
      max-width: 520px;
      height: 88vh;
      max-height: 780px;
      background: var(--card);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(139, 92, 246, 0.35);
      border: 1px solid rgba(192, 132, 252, 0.2);
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--card-light);
      border-bottom: 1px solid rgba(192, 132, 252, 0.12);
    }
    .bot-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
    }
    .chat-header h1 { margin: 0; font-size: 18px; color: var(--text); font-weight: 700; }
    .chat-header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 14px;
      word-wrap: break-word;
    }
    .message p { margin: 0; }
    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(192, 132, 252, 0.12);
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #ffffff;
      font-weight: 600;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }
    .message.thinking p { color: var(--muted); font-style: italic; }
    .chat-input-area {
      padding: 20px 24px;
      background: var(--card-light);
      border-top: 1px solid rgba(192, 132, 252, 0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .input-actions-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      align-items: center;
    }
    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: var(--purple);
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }
    .action-btn:hover {
      background: var(--purple-hover);
      transform: scale(1.08);
    }
    .upload-btn { background: #7c3aed; }
    .mic-btn.recording {
      background: #ef4444 !important;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .text-input-row { display: flex; gap: 10px; }
    .text-input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input-row input:focus { border-color: var(--purple); }
    .send-btn {
      background: var(--purple);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 22px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .send-btn:hover { background: var(--purple-hover); }
    .chat-log::-webkit-scrollbar { width: 6px; }
    .chat-log::-webkit-scrollbar-thumb { background: var(--card-light); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="bot-avatar">✨</div>
      <div>
        <h1>المساعد الذكي</h1>
        <p id="statusText">جاهز لتلقي صوتك أو ملفك أو كتاباتك</p>
      </div>
    </header>
    <div id="chatLog" class="chat-log">
      <div class="message bot">
        <p>مرحباً بك! اضغط على الميكروفون 🎤 للتسجيل، ارفع مقطعاً صوتياً 📁، أو اكتب سؤالك بالأسفل.</p>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="input-actions-row">
        <button id="micBtn" class="action-btn mic-btn" title="التسجيل المباشر">
          <span id="micIcon">🎤</span>
        </button>
        <label for="audioFileInput" class="action-btn upload-btn" title="رفع ملف صوتي">
          📁
          <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
        </label>
      </div>
      <div class="text-input-row">
        <input type="text" id="textInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="sendBtn" class="send-btn">إرسال</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
